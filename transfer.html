<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bankily - تحويل الأموال</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100vh; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* زر الانتقال لصفحة التأكيد */
        .hotspot-next {
            position: absolute;
            bottom: 20px;
            left: 5%;
            width: 90%;
            height: 55px;
            background: transparent;
            cursor: pointer;
            border: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <img src="transfer.png" alt="Transfer">
        <a href="confirm-transfer.html" class="hotspot-next"></a>
    </div>

</body>
</html>
