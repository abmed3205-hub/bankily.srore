<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bankily - تسجيل الدخول</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100vh; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* حقل رقم الهاتف بتصميم مرتب ومريح */
        .input-phone {
            position: absolute;
            top: 45%;
            left: 10%;
            width: 80%;
            height: 48px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 0 15px;
            outline: none;
            font-size: 16px;
            color: #333;
            direction: ltr;
            text-align: right;
        }

        /* حقل الرقم السري بتصميم مرتب ومريح */
        .input-pin {
            position: absolute;
            top: 57%;
            left: 10%;
            width: 80%;
            height: 48px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 0 15px;
            outline: none;
            font-size: 16px;
            color: #333;
            letter-spacing: 3px;
            text-align: right;
        }

        /* زر تسجيل الدخول الأصفر في الأسفل */
        .hotspot-login {
            position: absolute;
            bottom: 8%;
            left: 10%;
            width: 80%;
            height: 55px;
            background: transparent;
            cursor: pointer;
            border: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <img src="login.png" alt="Login">
        
        <input type="text" class="input-phone" placeholder="رقم الهاتف">
        <input type="password" class="input-pin" placeholder="••••">
        
        <a href="dashboard.html" class="hotspot-login"></a>
    </div>

</body>
</html>
