<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#00b0ba">
    <title>Bankily PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #00b0ba; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        .app-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
            justify-content: center; 
            align-items: center; 
            padding-top: env(safe-area-inset-top);
        }
        
        .app-screen.active { 
            display: flex; 
        }
        
        #screen-login { background: #ffffff; }
        #screen-dashboard, #screen-transfer-menu, #screen-send-form, #screen-pin, #screen-confirm { background: #00b0ba; }
        
        .screen-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            background: inherit;
        }

        .screen-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        .hotspot {
            position: absolute;
            background: transparent;
            cursor: pointer;
            border: none;
            z-index: 100;
            touch-action: manipulation;
        }

        .form-input {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            color: #485a6c;
            text-align: right;
            z-index: 90;
            font-weight: 300; 
        }

        /* رقم الهاتف */
        .phone-display {
            position: absolute;
            z-index: 95;
            font-size: 14.5px;
            color: #485a6c;
            background: transparent;
            direction: ltr;
            text-align: right;
            font-weight: bold;
            white-space: nowrap;
        }

        /* رقم الهاتف في شاشة الرمز السري (مصغر ومزاح للوراء قليلاً) */
        .pin-phone-display {
            position: absolute;
            z-index: 95;
            font-size: 13px;
            color: #485a6c;
            background: transparent;
            direction: ltr;
            text-align: right;
            font-weight: bold;
            white-space: nowrap;
            top: 15.5%;
            right: 22%; 
        }

        /* المبلغ */
        .amount-display {
            position: absolute;
            z-index: 95;
            font-size: 14.5px;
            color: #485a6c;
            background: #f4f5f7;
            direction: ltr;
            text-align: right;
            font-weight: bold;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة الترحيب الأولى -->
    <div id="screen-login" class="app-screen active">
        <div class="screen-container">
            <img src="login.png" alt="Welcome Splash">
            <div class="hotspot" style="top: 0; left: 0; width: 100%; height: 100%;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
        </div>
    </div>

    <!-- 2. لوحة القيادة -->
    <div id="screen-dashboard" class="app-screen">
        <div class="screen-container">
            <img src="dashboard.png" alt="Dashboard">
            <div class="hotspot" style="top: 0; right: 0; width: 52%; height: 22%;" ontouchstart="goToScreen('screen-transfer-menu', event)" onclick="goToScreen('screen-transfer-menu', event)"></div>
        </div>
    </div>

    <!-- 3. قائمة التحويل -->
    <div id="screen-transfer-menu" class="app-screen">
        <div class="screen-container">
            <img src="transfer.png" alt="Transfer Menu">
            <div class="hotspot" style="top: 0; right: 0; width: 22%; height: 12%;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
            <div class="hotspot" style="top: 0; right: 0; width: 50%; height: 30%;" ontouchstart="goToScreen('screen-send-form', event)" onclick="goToScreen('screen-send-form', event)"></div>
        </div>
    </div>

    <!-- 4. صفحة إدخال البيانات -->
    <div id="screen-send-form" class="app-screen">
        <div class="screen-container">
            <img src="send-form.png" alt="Send Form">
            
            <input type="tel" id="phone-input" class="form-input" 
                   style="top: 24.5%; right: 6%; width: 88%; height: 30px; direction: ltr;" 
                   maxlength="8" inputmode="numeric" pattern="[0-9]*" placeholder="" oninput="validatePhone(this)">

            <input type="tel" id="amount-input" class="form-input" 
                   style="top: 36.5%; right: 6%; width: 88%; height: 30px; direction: ltr;" 
                   maxlength="7" inputmode="numeric" pattern="[0-9]*" placeholder="" oninput="validateAmount(this)">

            <input type="text" id="note-input" class="form-input" 
                   style="top: 47.0%; right: 6%; width: 88%; height: 30px; direction: rtl;" 
                   maxlength="50" placeholder="">

            <div class="hotspot" style="top: 0; right: 0; width: 22%; height: 12%;" ontouchstart="goToScreen('screen-transfer-menu', event)" onclick="goToScreen('screen-transfer-menu', event)"></div>
            <div class="hotspot" style="bottom: 15px; left: 5%; width: 90%; height: 55px;" ontouchstart="submitForm(event)" onclick="submitForm(event)"></div>
        </div>
    </div>

    <!-- 5. شاشة إدخال الرمز السري (PIN Code) مع لوحة مفاتيح تفاعلية على الصورة -->
    <div id="screen-pin" class="app-screen">
        <div class="screen-container">
            <img src="screen-pin.png" alt="PIN Screen">
            
            <!-- رقم الهاتف (مصغر ومزاح للوراء) -->
            <div id="pin-display-phone" class="pin-phone-display" style="height: 26px;"></div>

            <!-- عرض نقاط الرمز السري فوق الشرطات -->
            <div id="pin-dots-display" style="position: absolute; top: 37.2%; left: 0; width: 100%; text-align: center; font-size: 26px; font-weight: bold; color: #485a6c; letter-spacing: 28px; z-index: 95; direction: ltr;"></div>

            <!-- زر الإغلاق (علامة ×) للرجوع لصفحة الإدخال -->
            <div class="hotspot" style="top: 24%; left: 16%; width: 10%; height: 8%;" ontouchstart="goToScreen('screen-send-form', event)" onclick="goToScreen('screen-send-form', event)"></div>

            <!-- زر "إرسال طلب" للانتقال لصفحة التأكيد -->
            <div class="hotspot" style="top: 45%; left: 18%; width: 64%; height: 8%;" ontouchstart="submitPin(event)" onclick="submitPin(event)"></div>

            <!-- تفاعل لوحة المفاتيح المضمنة في الصورة (أزرار الأرقام 0-9 والحذف) -->
            <!-- الصف الأول: 1, 2, 3 -->
            <div class="hotspot" style="top: 57%; left: 5%; width: 30%; height: 10%;" onclick="pressKey('1')"></div>
            <div class="hotspot" style="top: 57%; left: 35%; width: 30%; height: 10%;" onclick="pressKey('2')"></div>
            <div class="hotspot" style="top: 57%; left: 65%; width: 30%; height: 10%;" onclick="pressKey('3')"></div>

            <!-- الصف الثاني: 4, 5, 6 -->
            <div class="hotspot" style="top: 68%; left: 5%; width: 30%; height: 10%;" onclick="pressKey('4')"></div>
            <div class="hotspot" style="top: 68%; left: 35%; width: 30%; height: 10%;" onclick="pressKey('5')"></div>
            <div class="hotspot" style="top: 68%; left: 65%; width: 30%; height: 10%;" onclick="pressKey('6')"></div>

            <!-- الصف الثالث: 7, 8, 9 -->
            <div class="hotspot" style="top: 79%; left: 5%; width: 30%; height: 10%;" onclick="pressKey('7')"></div>
            <div class="hotspot" style="top: 79%; left: 35%; width: 30%; height: 10%;" onclick="pressKey('8')"></div>
            <div class="hotspot" style="top: 79%; left: 65%; width: 30%; height: 10%;" onclick="pressKey('9')"></div>

            <!-- الصف الرابع: 0 وزر الحذف ⌫ -->
            <div class="hotspot" style="top: 90%; left: 35%; width: 30%; height: 10%;" onclick="pressKey('0')"></div>
            <div class="hotspot" style="top: 90%; left: 65%; width: 30%; height: 10%;" onclick="pressKey('del')"></div>
        </div>
    </div>

    <!-- 6. صفحة مراجعة وتأكيد التفاصيل -->
    <div id="screen-confirm" class="app-screen">
        <div class="screen-container">
            <img src="success.png" alt="Confirm Review">
            
            <!-- رقم الهاتف -->
            <div id="display-phone" class="phone-display" style="top: 15.5%; right: 18%; height: 26px;"></div>
            
            <!-- المبلغ -->
            <div id="display-amount" class="amount-display" style="top: 25.8%; right: 8%; height: 26px;"></div>

            <!-- زر "تم" للعودة للوحة القيادة -->
            <div class="hotspot" style="bottom: 15px; left: 5%; width: 90%; height: 55px;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
        </div>
    </div>

    <script>
        let currentPin = "";

        function validatePhone(input) {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 8);
        }

        function validateAmount(input) {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 7);
        }

        function pressKey(digit) {
            if (digit === 'del') {
                currentPin = currentPin.slice(0, -1);
            } else if (currentPin.length < 4) {
                currentPin += digit;
            }
            updatePinDisplay();
        }

        function updatePinDisplay() {
            let displayStr = "";
            for (let i = 0; i < currentPin.length; i++) {
                displayStr += "•";
            }
            document.getElementById('pin-dots-display').innerText = displayStr;
        }

        function submitForm(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const phone = document.getElementById('phone-input').value;
            const amount = document.getElementById('amount-input').value;

            if (phone.length !== 8) {
                alert("الرجاء إدخال رقم هاتف صحيح يتكون من 8 أرقام.");
                return;
            }

            if (!amount || amount <= 0) {
                alert("الرجاء إدخال المبلغ المطلوب.");
                return;
            }

            document.getElementById('display-phone').innerText = phone;
            document.getElementById('display-amount').innerText = "MRU " + amount;
            document.getElementById('pin-display-phone').innerText = phone;
            
            // إعادة تعيين الرمز السري
            currentPin = "";
            updatePinDisplay();

            goToScreen('screen-pin');
        }

        function submitPin(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (currentPin.length !== 4) {
                alert("الرجاء إدخال الرمز السري المكون من 4 أرقام.");
                return;
            }

            goToScreen('screen-confirm');
        }

        function goToScreen(screenId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
