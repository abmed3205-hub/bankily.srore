<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Bankily PWA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100vh; 
            display: none; 
        }
        
        .app-screen.active { 
            display: block; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* مناطق النقر الفورية بدون أي تأخير */
        .hotspot {
            position: absolute;
            background: transparent;
            cursor: pointer;
            border: none;
            z-index: 10;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: تسجيل الدخول -->
    <div id="screen-login" class="app-screen active">
        <img src="login.png" alt="Login">
        <div class="hotspot" style="bottom: 6%; left: 10%; width: 80%; height: 55px;" ontouchstart="goToScreen('screen-dashboard')" onclick="goToScreen('screen-dashboard')"></div>
    </div>

    <!-- الشاشة الثانية: لوحة القيادة -->
    <div id="screen-dashboard" class="app-screen">
        <img src="dashboard.png" alt="Dashboard">
        <div class="hotspot" style="top: 2%; right: 4%; width: 44%; height: 16%;" ontouchstart="goToScreen('screen-transfer')" onclick="goToScreen('screen-transfer')"></div>
    </div>

    <!-- الشاشة الثالثة: إرسال الأموال -->
    <div id="screen-transfer" class="app-screen">
        <img src="transfer.png" alt="Transfer">
        <!-- زر الرجوع (السهم في الأعلى على اليمين) -->
        <div class="hotspot" style="top: 0%; right: 0%; width: 20%; height: 10%;" ontouchstart="goToScreen('screen-dashboard')" onclick="goToScreen('screen-dashboard')"></div>
        <!-- زر إرسال الأصفر في الأسفل (مغطى بالكامل) -->
        <div class="hotspot" style="bottom: 0%; left: 0%; width: 100%; height: 12%;" ontouchstart="goToScreen('screen-success')" onclick="goToScreen('screen-success')"></div>
    </div>

    <!-- الشاشة الرابعة: نجاح العملية -->
    <div id="screen-success" class="app-screen">
        <img src="success.png" alt="Success">
        <!-- زر "فعله!" الأزرق في النافذة المنسدلة للعودة للوحة القيادة -->
        <div class="hotspot" style="bottom: 22%; left: 12%; width: 76%; height: 60px;" ontouchstart="goToScreen('screen-dashboard')" onclick="goToScreen('screen-dashboard')"></div>
    </div>

    <script>
        // دالة انتقال فورية في لمح البصر
        function goToScreen(screenId) {
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }
    </script>

</body>
</html>
