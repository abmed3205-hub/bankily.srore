<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Bankily PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #000000; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        .app-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #ffffff; 
            display: none; 
            justify-content: center; 
            align-items: center; 
        }
        
        .app-screen.active { 
            display: flex; 
        }
        
        .screen-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            background: #ffffff;
        }

        .screen-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        .hotspot {
            position: absolute;
            background: transparent;
            cursor: pointer;
            border: none;
            z-index: 100;
            touch-action: manipulation;
        }

        .form-input {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            color: #000000;
            direction: ltr;
            text-align: right;
            z-index: 90;
            font-weight: 500;
        }

        .dynamic-text {
            position: absolute;
            z-index: 95;
            font-size: 14px;
            color: #000000;
            direction: ltr;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="screen-login" class="app-screen active">
        <div class="screen-container">
            <img src="login.png" alt="Login">
            <div class="hotspot" style="bottom: 40px; left: 10%; width: 80%; height: 55px;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
        </div>
    </div>

    <!-- 2. لوحة القيادة -->
    <div id="screen-dashboard" class="app-screen">
        <div class="screen-container">
            <img src="dashboard.png" alt="Dashboard">
            <div class="hotspot" style="top: 0; right: 0; width: 52%; height: 22%;" ontouchstart="goToScreen('screen-transfer-menu', event)" onclick="goToScreen('screen-transfer-menu', event)"></div>
        </div>
    </div>

    <!-- 3. قائمة التحويل (transfer.png) -->
    <div id="screen-transfer-menu" class="app-screen">
        <div class="screen-container">
            <img src="transfer.png" alt="Transfer Menu">
            <div class="hotspot" style="top: 0; right: 0; width: 22%; height: 12%;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
            <div class="hotspot" style="top: 0; right: 0; width: 50%; height: 30%;" ontouchstart="goToScreen('screen-send-form', event)" onclick="goToScreen('screen-send-form', event)"></div>
        </div>
    </div>

    <!-- 4. صفحة إدخال البيانات (send-form.png) -->
    <div id="screen-send-form" class="app-screen">
        <div class="screen-container">
            <img src="send-form.png" alt="Send Form">
            
            <!-- حقل رقم الهاتف: يبدأ تماماً تحت كلمة الرقم وبجانب الأيقونة -->
            <input type="tel" id="phone-input" class="form-input" 
                   style="top: 24.5%; right: 15%; width: 75%; height: 30px;" 
                   maxlength="8" 
                   inputmode="numeric" 
                   pattern="[0-9]*" 
                   placeholder=""
                   oninput="validatePhone(this)">

            <!-- حقل المبلغ: مرفوع قليلاً ليجلس بدقة فوق الخط الثاني -->
            <input type="tel" id="amount-input" class="form-input" 
                   style="top: 33.5%; right: 12%; width: 78%; height: 30px;" 
                   maxlength="7" 
                   inputmode="numeric" 
                   pattern="[0-9]*" 
                   placeholder=""
                   oninput="validateAmount(this)">

            <!-- حقل الملاحظة: في مكانه القياسي فوق الخط الثالث -->
            <input type="text" id="note-input" class="form-input" 
                   style="top: 47.0%; right: 12%; width: 78%; height: 30px;" 
                   maxlength="50" 
                   placeholder="">

            <!-- سهم الرجوع للقائمة -->
            <div class="hotspot" style="top: 0; right: 0; width: 22%; height: 12%;" ontouchstart="goToScreen('screen-transfer-menu', event)" onclick="goToScreen('screen-transfer-menu', event)"></div>
            
            <!-- زر إرسال الأصفر في الأسفل -->
            <div class="hotspot" style="bottom: 15px; left: 5%; width: 90%; height: 55px;" ontouchstart="submitForm(event)" onclick="submitForm(event)"></div>
        </div>
    </div>

    <!-- 5. صفحة التأكيد والنجاح (confirm.png) -->
    <div id="screen-confirm" class="app-screen">
        <div class="screen-container">
            <img src="confirm.png" alt="Confirm">
            
            <div id="display-phone" class="dynamic-text" style="top: 53.5%; right: 28%; width: 45%;"></div>
            <div id="display-amount" class="dynamic-text" style="top: 53.5%; right: 58%; width: 35%;"></div>

            <div class="hotspot" style="bottom: 22%; left: 15%; width: 70%; height: 50px;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
        </div>
    </div>

    <script>
        function validatePhone(input) {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 8);
        }

        function validateAmount(input) {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 7);
        }

        function submitForm(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const phone = document.getElementById('phone-input').value;
            const amount = document.getElementById('amount-input').value;

            if (phone.length !== 8) {
                alert("الرجاء إدخال رقم هاتف صحيح يتكون من 8 أرقام.");
                return;
            }

            if (!amount || amount <= 0) {
                alert("الرجاء إدخال المبلغ المطلوب.");
                return;
            }

            document.getElementById('display-phone').innerText = phone;
            document.getElementById('display-amount').innerText = amount + " MRU";

            goToScreen('screen-confirm');
        }

        function goToScreen(screenId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
