<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bankily - تسجيل الدخول</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #ffffff; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100vh; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* حقل رقم الهاتف الشفاف */
        .input-phone {
            position: absolute;
            top: 42%;
            left: 10%;
            width: 80%;
            height: 45px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
        }

        /* حقل الرقم السري الشفاف */
        .input-pin {
            position: absolute;
            top: 53%;
            left: 10%;
            width: 80%;
            height: 45px;
            background: transparent;
            border: none;
            outline: none;
            font-size: 16px;
        }

        /* زر تسجيل الدخول الشفاف */
        .hotspot-login {
            position: absolute;
            top: 66%;
            left: 10%;
            width: 80%;
            height: 50px;
            background: transparent;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>

    <div class="app-screen">
        <img src="login.png" alt="Login">
        
        <input type="text" class="input-phone">
        <input type="password" class="input-pin">
        
        <a href="dashboard.html" class="hotspot-login"></a>
    </div>

</body>
</html>
