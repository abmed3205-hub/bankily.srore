<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Bankily PWA</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: relative; 
            width: 100%; 
            max-width: 430px; 
            height: 100%; 
            max-height: 932px;
            display: none; 
        }
        
        .app-screen.active { 
            display: block; 
        }
        
        .app-screen img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        /* مناطق النقر (مرئية مؤقتاً بلون أحمر شفاف وإطار أصفر لترها بوضوح) */
        .hotspot {
            position: absolute;
            background: rgba(255, 0, 0, 0.3);
            border: 2px dashed yellow;
            cursor: pointer;
            z-index: 999;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: تسجيل الدخول -->
    <div id="screen-login" class="app-screen active">
        <img src="login.png" alt="Login">
        <div class="hotspot" style="bottom: 5%; left: 10%; width: 80%; height: 60px;" ontouchstart="goToScreen('screen-dashboard')" onclick="goToScreen('screen-dashboard')"></div>
    </div>

    <!-- الشاشة الثانية: لوحة القيادة -->
    <div id="screen-dashboard" class="app-screen">
        <img src="dashboard.png" alt="Dashboard">
        <div class="hotspot" style="top: 1%; right: 2%; width: 48%; height: 18%;" ontouchstart="goToScreen('screen-transfer')" onclick="goToScreen('screen-transfer')"></div>
    </div>

    <!-- الشاشة الثالثة: إرسال الأموال -->
    <div id="screen-transfer" class="app-screen">
        <img src="transfer.png" alt="Transfer">
        <!-- زر الرجوع في الأعلى -->
        <div class="hotspot" style="top: 0; right: 0; width: 25%; height: 12%;" ontouchstart="goToScreen('screen-dashboard')" onclick="goToScreen('screen-dashboard')"></div>
        <!-- زر إرسال الأصفر في الأسفل (مغطى بالكامل ومحدد باللون الأحمر والأصفر) -->
        <div class="hotspot" style="bottom: 0; left: 0; width: 100%; height: 15%;" ontouchstart="goToScreen('screen-confirm')" onclick="goToScreen('screen-confirm')"></div>
    </div>

    <!-- الشاشة الرابعة: التأكيد -->
    <div id="screen-confirm" class="app-screen">
        <img src="confirm.png" alt="Confirm">
        <div class="hotspot" style="top: 0; left: 0; width: 100%; height: 100%;" ontouchstart="goToScreen('screen-dashboard')" onclick="goToScreen('screen-dashboard')"></div>
    </div>

    <script>
        function goToScreen(screenId) {
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
