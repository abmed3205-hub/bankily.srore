<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#007a85">
    <title>Bankily PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #007a85; display: flex; justify-content: center; align-items: center; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        .app-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: none; 
            justify-content: center; 
            align-items: center; 
            padding-top: env(safe-area-inset-top);
        }
        
        .app-screen.active { 
            display: flex; 
        }
        
        #screen-login { background: #ffffff; }
        #screen-dashboard, #screen-transfer-menu, #screen-send-form, #screen-pin, #screen-success-popup { background: #007a85; }
        
        .screen-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            background: inherit;
        }

        .screen-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        .hotspot {
            position: absolute;
            background: transparent;
            cursor: pointer;
            border: none;
            z-index: 100;
            touch-action: manipulation;
        }

        .form-input {
            position: absolute;
            background: transparent;
            border: none;
            outline: none;
            font-size: 15px;
            color: #485a6c;
            text-align: right;
            z-index: 90;
            font-weight: 300; 
        }

        /* رقم الهاتف في شاشة الرمز السري */
        .pin-phone-display {
            position: absolute;
            z-index: 95;
            font-size: 13px;
            color: #000000;
            background: transparent;
            direction: ltr;
            text-align: right;
            font-weight: bold;
            white-space: nowrap;
            top: 13.8%;
            right: 18%; 
        }

        /* قيم البيانات في شاشة النجاح مطابقة للخط الرسمي */
        .success-val {
            position: absolute;
            z-index: 95;
            font-size: 11px;
            color: #333333;
            background: transparent;
            text-align: right;
            font-weight: 400;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة الترحيب الأولى -->
    <div id="screen-login" class="app-screen active">
        <div class="screen-container">
            <img src="login.png" alt="Welcome Splash">
            <div class="hotspot" style="top: 0; left: 0; width: 100%; height: 100%;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
        </div>
    </div>

    <!-- 2. لوحة القيادة -->
    <div id="screen-dashboard" class="app-screen">
        <div class="screen-container">
            <img src="dashboard.png" alt="Dashboard">
            <div class="hotspot" style="top: 0; right: 0; width: 52%; height: 22%;" ontouchstart="goToScreen('screen-transfer-menu', event)" onclick="goToScreen('screen-transfer-menu', event)"></div>
        </div>
    </div>

    <!-- 3. قائمة التحويل -->
    <div id="screen-transfer-menu" class="app-screen">
        <div class="screen-container">
            <img src="transfer.png" alt="Transfer Menu">
            <div class="hotspot" style="top: 0; right: 0; width: 22%; height: 12%;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
            <div class="hotspot" style="top: 0; right: 0; width: 50%; height: 30%;" ontouchstart="goToScreen('screen-send-form', event)" onclick="goToScreen('screen-send-form', event)"></div>
        </div>
    </div>

    <!-- 4. صفحة إدخال البيانات -->
    <div id="screen-send-form" class="app-screen">
        <div class="screen-container">
            <img src="send-form.png" alt="Send Form">
            
            <input type="tel" id="phone-input" class="form-input" 
                   style="top: 24.5%; right: 6%; width: 88%; height: 30px; direction: ltr;" 
                   maxlength="8" inputmode="numeric" pattern="[0-9]*" placeholder="" oninput="validatePhone(this)">

            <input type="tel" id="amount-input" class="form-input" 
                   style="top: 36.5%; right: 6%; width: 88%; height: 30px; direction: ltr;" 
                   maxlength="7" inputmode="numeric" pattern="[0-9]*" placeholder="" oninput="validateAmount(this)">

            <input type="text" id="note-input" class="form-input" 
                   style="top: 47.0%; right: 6%; width: 88%; height: 30px; direction: rtl;" 
                   maxlength="50" placeholder="">

            <div class="hotspot" style="top: 0; right: 0; width: 22%; height: 12%;" ontouchstart="goToScreen('screen-transfer-menu', event)" onclick="goToScreen('screen-transfer-menu', event)"></div>
            <div class="hotspot" style="bottom: 15px; left: 5%; width: 90%; height: 55px;" ontouchstart="submitForm(event)" onclick="submitForm(event)"></div>
        </div>
    </div>

    <!-- 5. شاشة إدخال الرمز السري (PIN Code) -->
    <div id="screen-pin" class="app-screen">
        <div class="screen-container">
            <img src="screen-pin.png" alt="PIN Screen">
            
            <div id="pin-display-phone" class="pin-phone-display" style="height: 26px;"></div>

            <div id="pin-dots-display" style="position: absolute; top: 38.3%; left: 3%; width: 100%; text-align: center; font-size: 25px; font-weight: bold; color: #485a6c; letter-spacing: 26px; z-index: 95; direction: ltr;"></div>

            <div class="hotspot" style="top: 24%; left: 16%; width: 10%; height: 8%;" ontouchstart="goToScreen('screen-send-form', event)" onclick="goToScreen('screen-send-form', event)"></div>

            <div class="hotspot" style="top: 45%; left: 18%; width: 64%; height: 8%;" ontouchstart="submitPin(event)" onclick="submitPin(event)"></div>

            <!-- لوحة المفاتيح التفاعلية -->
            <div class="hotspot" style="top: 57%; left: 5%; width: 30%; height: 10%;" ontouchstart="pressKey('1', event)" onclick="pressKey('1', event)"></div>
            <div class="hotspot" style="top: 57%; left: 35%; width: 30%; height: 10%;" ontouchstart="pressKey('2', event)" onclick="pressKey('2', event)"></div>
            <div class="hotspot" style="top: 57%; left: 65%; width: 30%; height: 10%;" ontouchstart="pressKey('3', event)" onclick="pressKey('3', event)"></div>

            <div class="hotspot" style="top: 68%; left: 5%; width: 30%; height: 10%;" ontouchstart="pressKey('4', event)" onclick="pressKey('4', event)"></div>
            <div class="hotspot" style="top: 68%; left: 35%; width: 30%; height: 10%;" ontouchstart="pressKey('5', event)" onclick="pressKey('5', event)"></div>
            <div class="hotspot" style="top: 68%; left: 65%; width: 30%; height: 10%;" ontouchstart="pressKey('6', event)" onclick="pressKey('6', event)"></div>

            <div class="hotspot" style="top: 79%; left: 5%; width: 30%; height: 10%;" ontouchstart="pressKey('7', event)" onclick="pressKey('7', event)"></div>
            <div class="hotspot" style="top: 79%; left: 35%; width: 30%; height: 10%;" ontouchstart="pressKey('8', event)" onclick="pressKey('8', event)"></div>
            <div class="hotspot" style="top: 79%; left: 65%; width: 30%; height: 10%;" ontouchstart="pressKey('9', event)" onclick="pressKey('9', event)"></div>

            <div class="hotspot" style="top: 90%; left: 35%; width: 30%; height: 10%;" ontouchstart="pressKey('0', event)" onclick="pressKey('0', event)"></div>
            <div class="hotspot" style="top: 90%; left: 65%; width: 30%; height: 10%;" ontouchstart="pressKey('del', event)" onclick="pressKey('del', event)"></div>
        </div>
    </div>

    <!-- 6. شاشة النجاح النهائية (Success Popup Screen) -->
    <div id="screen-success-popup" class="app-screen">
        <div class="screen-container">
            <img src="success-popup.png" alt="Success Popup">

            <!-- رقم الهاتف (مرفوع ومسحوب لليسار قليلاً) -->
            <div id="success-phone" class="success-val" style="top: 47.6%; right: 29.5%; direction: ltr;"></div>

            <!-- المبلغ (مرفوع للأعلى وقليلًا لليسار ليطابق الصدر الرسمي) -->
            <div id="success-amount" class="success-val" style="top: 48.5%; left: 19%; direction: ltr;"></div>

            <!-- التاريخ والوقت -->
            <div id="success-time" class="success-val" style="top: 57.8%; right: 28%; direction: ltr;"></div>

            <!-- زر "فعله!" الأزرق للعودة إلى لوحة القيادة -->
            <div class="hotspot" style="top: 62.2%; left: 16%; width: 68%; height: 8.5%;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
        </div>
    </div>

    <script>
        let currentPin = "";

        function validatePhone(input) {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 8);
        }

        function validateAmount(input) {
            input.value = input.value.replace(/[^0-9]/g, '').slice(0, 7);
        }

        function pressKey(digit, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (digit === 'del') {
                currentPin = currentPin.slice(0, -1);
            } else if (currentPin.length < 4) {
                currentPin += digit;
            }
            updatePinDisplay();
        }

        function updatePinDisplay() {
            let displayStr = "";
            for (let i = 0; i < currentPin.length; i++) {
                displayStr += "•";
            }
            document.getElementById('pin-dots-display').innerText = displayStr;
        }

        function submitForm(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            const phone = document.getElementById('phone-input').value;
            const amountVal = document.getElementById('amount-input').value;

            if (phone.length !== 8) {
                alert("الرجاء إدخال رقم هاتف صحيح يتكون من 8 أرقام.");
                return;
            }

            if (!amountVal || amountVal <= 0) {
                alert("الرجاء إدخال المبلغ المطلوب.");
                return;
            }

            document.getElementById('pin-display-phone').innerText = phone;
            
            currentPin = "";
            updatePinDisplay();

            goToScreen('screen-pin');
        }

        function submitPin(event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }

            if (currentPin.length !== 4) {
                alert("الرمز السري يجب أن يتكون من 4 أرقام.");
                return;
            }

            const phone = document.getElementById('phone-input').value;
            const amountVal = document.getElementById('amount-input').value;

            // جلب التاريخ والوقت الحالي ديناميكياً
            const now = new Date();
            const yy = String(now.getFullYear()).slice(-2);
            const mm = String(now.getMonth() + 1).padStart(2, '0');
            const dd = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const dateTimeStr = `${yy}-${mm}-${dd} ${hours}:${minutes}:${seconds}`;

            // حقن القيم مباشرة في أماكنها
            document.getElementById('success-phone').innerText = phone;
            document.getElementById('success-amount').innerText = `MRU ${amountVal}`;
            document.getElementById('success-time').innerText = dateTimeStr;

            goToScreen('screen-success-popup');
        }

        function goToScreen(screenId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
