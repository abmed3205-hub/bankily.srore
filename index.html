<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Bankily PWA</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; background-color: #000000; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        
        .app-screen { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background: #ffffff; 
            display: none; 
            justify-content: center; 
            align-items: center; 
        }
        
        .app-screen.active { 
            display: flex; 
        }
        
        .screen-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 100%;
            background: #ffffff;
        }

        .screen-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: fill; 
            display: block; 
        }
        
        .hotspot {
            position: absolute;
            background: transparent;
            cursor: pointer;
            border: none;
            z-index: 100;
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <!-- 1. شاشة تسجيل الدخول -->
    <div id="screen-login" class="app-screen active">
        <div class="screen-container">
            <img src="login.png" alt="Login">
            <div class="hotspot" style="bottom: 40px; left: 10%; width: 80%; height: 55px;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
        </div>
    </div>

    <!-- 2. لوحة القيادة -->
    <div id="screen-dashboard" class="app-screen">
        <div class="screen-container">
            <img src="dashboard.png" alt="Dashboard">
            <!-- الانتقال إلى قائمة التحويل (transfer.png) -->
            <div class="hotspot" style="top: 0; right: 0; width: 52%; height: 22%;" ontouchstart="goToScreen('screen-transfer-menu', event)" onclick="goToScreen('screen-transfer-menu', event)"></div>
        </div>
    </div>

    <!-- 3. قائمة التحويل (transfer.png) -->
    <div id="screen-transfer-menu" class="app-screen">
        <div class="screen-container">
            <img src="transfer.png" alt="Transfer Menu">
            <!-- سهم الرجوع للوحة القيادة -->
            <div class="hotspot" style="top: 0; right: 0; width: 22%; height: 12%;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
            <!-- النقر على زر "إرسال الأموال" (القسم الأيمن العلوي) للانتقال لصفحة الإدخال -->
            <div class="hotspot" style="top: 0; right: 0; width: 50%; height: 30%;" ontouchstart="goToScreen('screen-send-form', event)" onclick="goToScreen('screen-send-form', event)"></div>
        </div>
    </div>

    <!-- 4. صفحة إدخال رقم الهاتف والمبلغ (send-form.png) -->
    <div id="screen-send-form" class="app-screen">
        <div class="screen-container">
            <img src="send-form.png" alt="Send Form">
            <!-- سهم الرجوع للقائمة -->
            <div class="hotspot" style="top: 0; right: 0; width: 22%; height: 12%;" ontouchstart="goToScreen('screen-transfer-menu', event)" onclick="goToScreen('screen-transfer-menu', event)"></div>
            <!-- زر إرسال الأصفر في الأسفل للانتقال للنجاح -->
            <div class="hotspot" style="bottom: 15px; left: 5%; width: 90%; height: 55px;" ontouchstart="goToScreen('screen-confirm', event)" onclick="goToScreen('screen-confirm', event)"></div>
        </div>
    </div>

    <!-- 5. صفحة النجاح والتأكيد (confirm.png) -->
    <div id="screen-confirm" class="app-screen">
        <div class="screen-container">
            <img src="confirm.png" alt="Confirm">
            <!-- زر "فعله!" الأزرق للعودة للوحة القيادة -->
            <div class="hotspot" style="bottom: 22%; left: 15%; width: 70%; height: 50px;" ontouchstart="goToScreen('screen-dashboard', event)" onclick="goToScreen('screen-dashboard', event)"></div>
        </div>
    </div>

    <script>
        function goToScreen(screenId, event) {
            if (event) {
                event.preventDefault();
                event.stopPropagation();
            }
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
            window.scrollTo(0, 0);
        }
    </script>

</body>
</html>
